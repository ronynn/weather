name: Build Tauri Android APK (arm64)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # ---- Cargo cache (reasonable size, saves compile time) ----
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version ^2.0.0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ---- Android SDK (not cached, to keep storage low) ----
      - name: Install Android command-line tools
        run: |
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip commandlinetools-linux-*.zip
          mkdir -p $HOME/android-sdk/cmdline-tools
          mv cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept licenses and install components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"

      - name: Set NDK environment
        run: echo "ANDROID_NDK_HOME=$HOME/android-sdk/ndk/25.2.9519653" >> $GITHUB_ENV

      # ---- Init Tauri (non‑interactive) ----
      - name: Clean previous src-tauri
        run: rm -rf src-tauri

      - name: Initialize Tauri
        run: |
          printf "\n\n../\n" | cargo tauri init --app-name MyApp --window-title MyApp

      # ---- Replace default identifier with a unique one (using sed) ----
      - name: Fix bundle identifier
        run: |
          sed -i 's/"identifier": "com.tauri.dev"/"identifier": "com.myapp.tester"/' src-tauri/tauri.conf.json

      - name: Initialize Android
        run: cargo tauri android init

      - name: Build APK (arm64)
        run: cargo tauri android build --apk --target aarch64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-arm64-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/app-arm64-v8a-release.apk
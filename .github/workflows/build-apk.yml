name: Build Tauri Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            src-tauri/target
          key: ${{ runner.os }}-cargo-v1

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version ^2.0.0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK
        run: |
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip commandlinetools-linux-*.zip
          mkdir -p $HOME/android-sdk/cmdline-tools
          mv cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept licenses and install components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"

      - name: Set NDK environment
        run: echo "ANDROID_NDK_HOME=$HOME/android-sdk/ndk/25.2.9519653" >> $GITHUB_ENV

      # ---- Create the complete Tauri project from scratch ----
      - name: Create src-tauri folder
        run: |
          mkdir -p src-tauri/src
          cat > src-tauri/tauri.conf.json << 'EOF'
          {
            "build": {
              "beforeDevCommand": "",
              "beforeBuildCommand": "",
              "devPath": "..",
              "distDir": ".."
            },
            "bundle": {
              "identifier": "com.myapp.tester",
              "icon": [],
              "resources": []
            },
            "app": {
              "windows": [
                {
                  "title": "MyApp",
                  "width": 800,
                  "height": 600
                }
              ]
            }
          }
          EOF

          cat > src-tauri/Cargo.toml << 'EOF'
          [package]
          name = "myapp"
          version = "0.1.0"
          edition = "2021"

          [lib]
          crate-type = ["staticlib", "cdylib", "rlib"]

          [build-dependencies]
          tauri-build = { version = "2", features = [] }

          [dependencies]
          tauri = { version = "2", features = ["api-all"] }
          serde = { version = "1", features = ["derive"] }
          serde_json = "1"
          EOF

          cat > src-tauri/src/lib.rs << 'EOF'
          #[cfg_attr(mobile, tauri::mobile_entry_point)]
          pub fn run() {
            tauri::Builder::default()
              .run(tauri::generate_context!())
              .expect("error while running tauri application");
          }
          EOF

          cat > src-tauri/src/main.rs << 'EOF'
          #![cfg_attr(not(debug_assertions), windows_subsystem = "windows")]
          fn main() { myapp_lib::run(); }
          EOF

      # ---- Now initialise Android (this will use our config) ----
      - name: Initialize Android
        run: cargo tauri android init

      - name: Build APK (arm64)
        run: cargo tauri android build --apk --target aarch64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tauri-arm64-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/app-arm64-v8a-release.apk